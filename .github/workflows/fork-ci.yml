name: fork-ci

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  fork-checks:
    name: Fork checks
    if: ${{ github.repository != 'openai/codex' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check changed files for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          elif git rev-parse --verify HEAD~1 >/dev/null; then
            git diff --check HEAD~1 HEAD
          else
            git diff-tree --check --root HEAD
          fi

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          components: rustfmt

      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: Test app-server protocol
        working-directory: codex-rs
        run: cargo test -p codex-app-server-protocol

      - name: Test account auth boundary
        working-directory: codex-rs
        run: cargo test -p codex-app-server suite::v2::account
