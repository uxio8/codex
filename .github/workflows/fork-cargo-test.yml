name: fork-cargo-test

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fork-cargo-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cargo-test:
    name: Full Cargo test
    if: ${{ github.repository != 'openai/codex' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js for js_repl tests
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: codex-rs/node-version.txt

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0

      - name: Build Codex test helper binary
        run: cargo build -p codex-cli --bin codex

      - name: Build Linux sandbox test helper binary
        run: cargo build -p codex-linux-sandbox --bin codex-linux-sandbox

      - name: Enable unprivileged user namespaces
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run full Cargo test suite
        run: cargo test
